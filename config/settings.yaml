# AML Alert Triage (aml-alert-triage) runtime configuration.
#
# Loaded by `src/aml_alert_triage/config.py`. Point at a different file with
# AMLTRIAGE_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY REFUSES at boot (an operator who emptied a value expressed an intent, and it
# names nothing, so it must not inherit the default and must not silently become the empty
# string either), and a set value wins. To take the default written here, UNSET the variable.
# This file holds env var NAMES and non-secret defaults only: no secret value is ever committed
# here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${AMLTRIAGE_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${AMLTRIAGE_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${AMLTRIAGE_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${AMLTRIAGE_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HUMAN_REVIEW_S2S_TOKEN / HUMAN_REVIEW_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound AMLTRIAGE_S2S_TOKEN.
review_url: ${HUMAN_REVIEW_URL:-}

# The typology rule pack. Empty means the shipped reference pack (rulepacks/typologies.yaml). An
# adopter points this at its own pack to add markets or tighten thresholds without a code edit.
typology_pack_path: ${AMLTRIAGE_TYPOLOGY_PACK:-}

# Bank-owned triage policy (practices check B4). The score baseline, the band thresholds and the
# recommendation map are the client's numbers, not the engine's. The shipped defaults equal the
# reference in domain/policy.py; override any subset here. Kept as literals (not env refs)
# because they are policy, not deployment wiring.
policy:
  base_score: 0.20
  max_score: 1.0
  band_thresholds:
    critical: 0.85
    high: 0.60
    medium: 0.35
  recommendations:
    critical: escalate_sar
    high: escalate_sar
    medium: request_info
    low: close

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  alert_feed:
    local: aml_alert_triage.adapters.local.alert_feed:LocalAlertFeed
    gcp: aml_alert_triage.adapters.gcp.alert_feed:CloudAlertFeed
    onprem: aml_alert_triage.adapters.onprem.alert_feed:OnPremAlertFeed
  warehouse:
    local: aml_alert_triage.adapters.local.warehouse:LocalWarehouse
    gcp: aml_alert_triage.adapters.gcp.warehouse:CloudWarehouse
    onprem: aml_alert_triage.adapters.onprem.warehouse:OnPremWarehouse
  retrieval:
    local: aml_alert_triage.adapters.local.retrieval:LocalRetrieval
    gcp: aml_alert_triage.adapters.gcp.retrieval:CloudRetrieval
    onprem: aml_alert_triage.adapters.onprem.retrieval:OnPremRetrieval
  narration:
    local: aml_alert_triage.adapters.local.narration:LocalNarration
    gcp: aml_alert_triage.adapters.gcp.narration:CloudNarration
    onprem: aml_alert_triage.adapters.onprem.narration:OnPremNarration
  audit:
    local: aml_alert_triage.adapters.local.audit:LocalAuditAdapter
    gcp: aml_alert_triage.adapters.gcp.audit:CloudAuditAdapter
    onprem: aml_alert_triage.adapters.onprem.audit:OnPremAuditAdapter
  identity:
    local: aml_alert_triage.adapters.local.identity:LocalIdentityAdapter
    gcp: aml_alert_triage.adapters.gcp.identity:IapIdentityAdapter
    onprem: aml_alert_triage.adapters.onprem.identity:OnPremIdentityAdapter
  review_router:
    local: aml_alert_triage.adapters.local.review_router:LocalReviewRouter
    gcp: aml_alert_triage.adapters.gcp.review_router:CloudReviewRouter
    onprem: aml_alert_triage.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the agent-observability collector when it
  # is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: aml_alert_triage.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: aml_alert_triage.adapters.gcp.tracer:CloudTracerAdapter
    onprem: aml_alert_triage.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (model-quality-gate). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: aml_alert_triage.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: aml_alert_triage.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: aml_alert_triage.adapters.onprem.evaluation:OnPremEvalAdapter
